<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/slot.css">
    <title>Slot Machine</title>
</head>

<body>
    <!-- Slot Machine Container -->
    <div id="slotMachine">
        <h1>Slot Machine</h1>
        <div id="reelContainer">
            <div class="reelCards">
                <p id="reel1">🍒</p>
            </div>
            <div class="reelCards">
                <p id="reel2">🍋</p>
            </div>
            <div class="reelCards">
                <p id="reel3">🍊</p>
            </div>
        </div>
        <!-- Bet Container -->
        <div id="betContainer">
            <h2 id="balance">$1000</h2>
            <!-- Button Container -->
            <div id="intentions">
                <input type="number" id="bet" placeholder="5" min="5" max="50">
                <button id="spin">Spin</button>
            </div>
            <h2 id="result">Result</h2>
        </div>
        <script src="js/slot.js"></script>
</body>
</body>

</html>
